<body>
<noscript><div style="padding:24px;max-width:560px;margin:24px auto;font:16px/1.5 system-ui,sans-serif;border:1px solid #d9d5cb;border-radius:12px;background:#fff"><b>JavaScript is turned off.</b><br>Online booking needs it. Please turn it on in your browser settings, or reach us through our <a href="https://californiaartdelivery.com/pages/contact">Contact Us page</a> at californiaartdelivery.com/pages/contact.</div></noscript>
<!-- Header is in normal document flow (not fixed/sticky), so page content can never sit underneath it. -->
<header class="top" id="top">
  <div class="top-row">
    <div class="brand"><img class="logo" src="/cad-logo.jpg" width="1023" height="928" alt="California Art Delivery"></div>
    <div class="steps-label" id="stepsLabel"></div>
  </div>
  <div class="progress" id="progress" role="progressbar" aria-label="Booking progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i><span class="beam-clip" aria-hidden="true"><span class="beam-pulse"></span></span><span class="beam-tip" aria-hidden="true"></span></i></div>
</header>
<main id="app" class="app"></main>
<footer class="dock" id="dock">
  <button class="need-line" id="needLine" type="button" hidden></button>
  <p class="dock-err" id="dockErr" role="alert" hidden></p>
  <div class="dock-row">
    <div class="estimate">
      <div class="est-label" id="estLabel">Total</div>
      <div class="est-total" id="estTotal">—</div>
    </div>
    <div class="dock-actions">
      <button class="btn back" id="backBtn" type="button" aria-label="Back">Back</button>
      <button class="btn primary" id="nextBtn" type="button">Next</button>
    </div>
  </div>
  <div class="est-note" id="estNote" hidden></div>
</footer>
<script src="/access.js?v=34"></script>
<script src="/zones.js?v=1"></script>
<script src="/validate.js?v=4"></script>
