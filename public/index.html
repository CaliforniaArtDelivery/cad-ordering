<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Book with California Art Delivery</title>
<link rel="icon" type="image/png" href="/cad-logo.jpg">
<link rel="apple-touch-icon" href="/cad-logo.jpg">
<link rel="stylesheet" href="/styles.css?v=36">
</head>
<body>
<noscript><div style="padding:24px;max-width:560px;margin:24px auto;font:16px/1.5 system-ui,sans-serif;border:1px solid #d9d5cb;border-radius:12px;background:#fff"><b>JavaScript is turned off.</b><br>Online booking needs it. Please turn it on in your browser settings, or call us: North &amp; Central (831) 596-1139 · South (949) 765-5255.</div></noscript>
<!-- Header is in normal document flow (not fixed/sticky), so page content can never sit underneath it. -->
<header class="top" id="top">
  <div class="top-row">
    <div class="brand"><img class="logo" src="/cad-logo.jpg" width="1023" height="928" alt="California Art Delivery"></div>
    <div class="steps-label" id="stepsLabel"></div>
  </div>
  <div class="progress" id="progress" role="progressbar" aria-label="Booking progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
</header>
<main id="app" class="app"></main>
<footer class="dock" id="dock">
  <button class="need-line" id="needLine" type="button" hidden></button>
  <div class="dock-row">
    <div class="estimate">
      <div class="est-label" id="estLabel">Estimate</div>
      <div class="est-total" id="estTotal">—</div>
    </div>
    <div class="dock-actions">
      <button class="btn back" id="backBtn" type="button" aria-label="Back">Back</button>
      <button class="btn primary" id="nextBtn" type="button">Next</button>
    </div>
  </div>
  <div class="est-note" id="estNote" hidden></div>
</footer>
<script src="/access.js?v=31"></script>
<script src="/validate.js?v=1"></script>
<script src="/app.js?v=38"></script>
</body>
</html>
